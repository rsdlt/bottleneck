id = "rsdlt.bottleneck"
name = "Bottleneck"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Measure how long your agents sit waiting on you."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

# Each hook run appends one line to $HERDR_PLUGIN_STATE_DIR/events.jsonl.
[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/bottleneck", "record"]

[[events]]
on = "pane.closed"
command = ["./target/release/bottleneck", "record"]

[[events]]
on = "pane.exited"
command = ["./target/release/bottleneck", "record"]

# Marks a Herdr (re)start, so waits left open across it are not counted.
[[startup]]
command = ["./target/release/bottleneck", "record"]

# The report, opened by the action below.
[[panes]]
id = "report"
title = "Bottleneck"
placement = "popup"
# Fixed width: the widest content (title and legend) needs about 76 cells.
width = 80
height = "80%"
command = ["./target/release/bottleneck", "view"]

# Bind it to a key in Herdr's config, for example:
#   [[keys.command]]
#   key = "prefix+b"
#   type = "plugin_action"
#   command = "rsdlt.bottleneck.open-report"
#   description = "Bottleneck report"
[[actions]]
id = "open-report"
title = "Show bottleneck report"
command = ["./target/release/bottleneck", "open"]
